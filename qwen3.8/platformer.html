// SPRITE DATA - Original pixel art defined as string maps

// ============================================================
function makeSprite(rows, palette) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++)
    for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      if (ch !== '.' && palette[ch]) { g.fillStyle = palette[ch]; g.fillRect(x, y, 1, 1); }
    }
  return c;
}
function flipH(spr) {
  const c = document.createElement('canvas');
  c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d');
  g.translate(spr.width, 0); g.scale(-1, 1);
  g.drawImage(spr, 0, 0);
  return c;
}

// ============================================================
// LEVEL DATA - Original level design
// Legend: # ground, B brick, ? question(coin), M question(mushroom)
//         P pipe(2 wide), S stair block, C coin, E enemy, T turtle
//         F flag, D castle door marker
// ============================================================
const LEVEL_W = 220; // tiles wide
const LEVEL_H = 15;
let level = [];

function buildLevel() {
  level = Array.from({length: LEVEL_H}, () => Array(LEVEL_W).fill(0));
  const set = (x, y, v) => { if (x >= 0 && x < LEVEL_W && y >= 0 && y < LEVEL_H) level[y][x] = v; };
  const ground = (x0, x1) => { for (let x = x0; x <= x1; x++) { set(x, 13, 1); set(x, 14, 1); } };
  const pipe = (x, h) => {
    const top = 13 - h;
    set(x, top, 5); set(x+1, top, 6);
    for (let y = top+1; y < 13; y++) { set(x, y, 7); set(x+1, y, 8); }
  };
  const stairUp = (x, h) => { for (let i = 0; i < h; i++) for (let y = 12 - i; y <= 12; y++) set(x + i, y, 9); };
  const stairDown = (x, h) => { for (let i = 0; i < h; i++) for (let y = 12 - (h - 1 - i); y <= 12; y++) set(x + i, y, 9); };

  // Ground sections with gaps
  ground(0, 68); ground(71, 85); ground(89, 152); ground(155, 219);

  // Section 1: intro area
  set(16, 9, 3); // question block with coin
  set(20, 9, 2); set(21, 9, 4); set(22, 9, 2); set(23, 9, 3); set(24, 9, 2);
  set(22, 5, 4); // high mushroom block

  // Enemies early
  set(22, 12, 10); set(40, 12, 10); set(51, 12, 10); set(52, 12, 10);

  // Pipes
  pipe(28, 2); pipe(38, 3); pipe(46, 4); pipe(57, 4);

  // Section 2: after first gap
  set(77, 9, 2); set(78, 9, 4); set(79, 9, 2);
  set(80, 5, 2); set(81, 5, 2); set(82, 5, 2); set(83, 5, 2);
  set(84, 5, 2); set(85, 5, 2); set(86, 5, 2); set(87, 5, 2);
  set(91, 5, 2); set(92, 5, 2); set(93, 5, 2);
  set(94, 9, 3);

  // Coins in the air
  for (let x = 81; x <= 86; x++) set(x, 3, 11);
  set(74, 8, 11); set(75, 7, 11);

  // Enemies
  set(82, 12, 10); set(83, 12, 10); set(97, 12, 13); set(105, 12, 10); set(106, 12, 10);

  // Section 3: brick rows and pipes
  pipe(100, 2);
  set(106, 9, 2); set(107, 9, 3); set(108, 9, 2);
  set(109, 5, 2); set(110, 5, 2); set(111, 5, 4); set(112, 5, 2);
  pipe(116, 3);

  // High coin run
  for (let x = 121; x <= 128; x++) set(x, 5, 11);
  set(121, 9, 2); set(122, 9, 2); set(123, 9, 3); set(124, 9, 2); set(125, 9, 2);

  // Turtle patrol
  set(130, 12, 13); set(140, 12, 13);

  // Staircase up before gap
  stairUp(134, 4); stairDown(138, 4);
  set(136, 8, 11); set(137, 8, 11);

  // Section 4: final stretch
  set(158, 9, 2); set(159, 9, 3); set(160, 9, 2);
  set(164, 9, 2); set(165, 9, 4); set(166, 9, 2);
  set(170, 12, 10); set(171, 12, 10); set(172, 12, 10);

  // Big staircase to flag
  stairUp(178, 8);

  // Flag at column 190
  for (let y = 4; y <= 12; y++) set(190, y, 12);
  set(190, 3, 14); // flag top

  // Castle (decorative)
  for (let x = 196; x <= 203; x++) for (let y = 9; y <= 12; y++) set(x, y, 15);
  for (let x = 197; x <= 202; x++) for (let y = 6; y <= 8; y++) set(x, y, 15);
  set(197, 5, 15); set(199, 5, 15); set(201, 5, 15); // battlements
  set(199, 11, 16); set(199, 12, 16); set(200, 11, 16); set(200, 12, 16); // door
}

  buildLevel();

    dir: 1, grounded: false, big: false, invincible: 0,

  particles = [];
  floatTexts = [];
  items = [];
  bumpAnims = {};
  camX = 0; time = 400; timeAcc = 0;
  levelComplete = false; winTimer = 0;
  // Spawn enemies from level data
  for (let y = 0; y < LEVEL_H; y++)
    for (let x = 0; x < LEVEL_W; x++) {
      if (level[y][x] === 10) { enemies.push(makeEnemy(x * TILE, y * TILE + 2, 'grump')); level[y][x] = 0; }
      if (level[y][x] === 13) { enemies.push(makeEnemy(x * TILE, y * TILE + 2, 'turtle')); level[y][x] = 0; }
    }
}

function makeEnemy(x, y, type) {
  return {
    x, y, vx: -0.4, vy: 0, w: 14, h: 14, type,
    active: false, dead: false, deadTimer: 0,
    shell: false, shellMoving: false, animTimer: 0, squishTimer: 0,
  };
}

// ============================================================
// COLLISION HELPERS
// ============================================================
function tileAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || tx >= LEVEL_W || ty < 0 || ty >= LEVEL_H) return ty >= LEVEL_H ? 1 : 0;
  return level[ty][tx];
}
function isSolid(t) { return SOLID.has(t); }

function collideX(ent) {
  const top = ent.y + 1, bot = ent.y + ent.h - 1;
  if (ent.vx > 0) {
    const rx = ent.x + ent.w;
    if (isSolid(tileAt(rx, top)) || isSolid(tileAt(rx, bot)) || isSolid(tileAt(rx, ent.y + ent.h/2))) {
      ent.x = Math.floor(rx / TILE) * TILE - ent.w - 0.01;
      ent.vx = 0; return true;
    }
  } else if (ent.vx < 0) {
    if (isSolid(tileAt(ent.x, top)) || isSolid(tileAt(ent.x, bot)) || isSolid(tileAt(ent.x, ent.y + ent.h/2))) {
      ent.x = (Math.floor(ent.x / TILE) + 1) * TILE + 0.01;
      ent.vx = 0; return true;
    }
  }
  return false;
}

function collideY(ent) {
  const left = ent.x + 1, right = ent.x + ent.w - 1;
  ent.grounded = false;
  if (ent.vy > 0) {
    const by = ent.y + ent.h;
    if (isSolid(tileAt(left, by)) || isSolid(tileAt(right, by)) || isSolid(tileAt(ent.x + ent.w/2, by))) {
      ent.y = Math.floor(by / TILE) * TILE - ent.h;
      ent.vy = 0; ent.grounded = true;
    }
  } else if (ent.vy < 0) {
    if (isSolid(tileAt(left, ent.y)) || isSolid(tileAt(right, ent.y)) || isSolid(tileAt(ent.x + ent.w/2, ent.y))) {
      ent.y = (Math.floor(ent.y / TILE) + 1) * TILE + 0.01;
      ent.vy = 0;
      // Hit block from below
      if (ent === player) hitBlockAbove(ent);
      return 'ceil';
    }
  }
  return null;
}

function hitBlockAbove(ent) {
  const headY = Math.floor((ent.y - 1) / TILE);
  const cx = Math.floor((ent.x + ent.w / 2) / TILE);
  // Check tiles the head overlaps
  const leftT = Math.floor((ent.x + 2) / TILE);
  const rightT = Math.floor((ent.x + ent.w - 2) / TILE);
  for (let tx = leftT; tx <= rightT; tx++) {
    const t = level[headY] ? level[headY][tx] : 0;
    if (QBLOCKS.has(t)) {
      bumpAnims[tx + ',' + headY] = 8;
      if (t === 3) { // coin
        coins++; score += 200;
        floatTexts.push({x: tx * TILE + 4, y: headY * TILE - 10, text: '200', timer: 40});
        particles.push({type: 'coinPop', x: tx * TILE + 4, y: headY * TILE - 8, vy: -5, timer: 20});
      } else { // mushroom
        items.push({x: tx * TILE, y: headY * TILE - TILE, vx: 1, vy: 0, w: 14, h: 14, type: 'mushroom', rising: 12});
      }
      level[headY][tx] = 17; // used block (rendered as 'used')
      return;
    } else if (t === 2) {
      if (player.big) {
        // Break brick
        level[headY][tx] = 0;
        score += 50;
        for (let i = 0; i < 4; i++)
          particles.push({
            type: 'debris', x: tx * TILE + (i % 2) * 8, y: headY * TILE + Math.floor(i / 2) * 8,
            vx: (i % 2 === 0 ? -1.5 : 1.5) + Math.random(), vy: -4 - Math.random() * 2, timer: 50,
          });
      } else {
        bumpAnims[tx + ',' + headY] = 8;
      }
      return;
    }
  }
}

// ============================================================
// PLAYER UPDATE
// ============================================================
function updatePlayer() {
  if (player.dead) return;
  const p = player;
  const left = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const jump = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
  const run = keys['KeyZ'] || keys['KeyX'] || keys['ShiftLeft'];

  if (p.growTimer > 0) { p.growTimer--; return; }
  if (p.shrinkTimer > 0) { p.shrinkTimer--; return; }

  // Horizontal movement
  const maxSpd = run ? MAX_RUN : MAX_WALK;
  const acc = run ? RUN_ACC : WALK_ACC;
  if (right && !left) { p.vx += acc; p.dir = 1; }
  else if (left && !right) { p.vx -= acc; p.dir = -1; }
  else {
    // Friction
    if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION);
    else p.vx = Math.min(0, p.vx + FRICTION);
  }
  p.vx = Math.max(-maxSpd, Math.min(maxSpd, p.vx));

  // Jumping - classic variable height
  if (jump && p.grounded && !p.jumping) {
    p.vy = JUMP_VEL;
    p.grounded = false;
    p.jumping = true;
  }
  if (!jump) p.jumping = false;
  if (p.jumping && jump && p.vy < 0) p.vy += JUMP_HOLD;

  // Gravity
  p.vy = Math.min(p.vy + GRAV, MAX_FALL);

  // Move & collide
  p.x += p.vx;
  collideX(p);
  p.y += p.vy;
  collideY(p);

  // Keep in bounds
  if (p.x < camX) { p.x = camX; p.vx = 0; }
  if (p.x < 0) p.x = 0;

  // Fall death
  if (p.y > LEVEL_H * TILE + 16) killPlayer(true);

  // Invincibility timer
  if (p.invincible > 0) p.invincible--;

  // Animation
  p.animTimer++;
  if (Math.abs(p.vx) > 0.2 && p.grounded) {
    if (p.animTimer % 6 === 0) p.animFrame = (p.animFrame + 1) % 3;
  } else if (p.grounded) p.animFrame = 0;

  // Coin collection from level
  const pcx = Math.floor((p.x + p.w/2) / TILE);
  const pcy0 = Math.floor(p.y / TILE), pcy1 = Math.floor((p.y + p.h) / TILE);
  for (let ty = pcy0; ty <= pcy1; ty++)
    for (let tx = Math.floor(p.x / TILE); tx <= Math.floor((p.x + p.w) / TILE); tx++) {
      if (ty >= 0 && ty < LEVEL_H && tx >= 0 && tx < LEVEL_W && level[ty][tx] === 11) {
        level[ty][tx] = 0; coins++; score += 100;
        floatTexts.push({x: tx * TILE + 4, y: ty * TILE, text: '100', timer: 30});
      }
    }

  // Flagpole check
  const ft = tileAt(p.x + p.w / 2, p.y + p.h / 2);
  if (ft === 12 || ft === 14) startWin();
}

function killPlayer(fell) {
  if (player.dead) return;
  player.dead = true;
  player.vy = fell ? 0 : JUMP_VEL * 0.8;
  state = 'dying';
  winTimer = 0;
}

function hurtPlayer() {
  if (player.invincible > 0 || player.dead) return;
  if (player.big) {
    player.big = false;
    player.h = 14;
    player.invincible = 90;
    player.shrinkTimer = 20;
  } else {
    killPlayer(false);
  }
}

function startWin() {
  if (levelComplete) return;
  levelComplete = true;
  state = 'win';
  winTimer = 0;
  score += time * 10;
  player.vx = 0;
}

// ============================================================
// ENEMY UPDATE
// ============================================================
function updateEnemies() {
  for (const e of enemies) {
    // Activate when near camera
    if (!e.active && e.x < camX + W + 32) e.active = true;
    if (!e.active || e.x < camX - 64 || e.x > camX + W + 128) continue;

    if (e.squishTimer > 0) { e.squishTimer--; if (e.squishTimer <= 0) e.dead = true; continue; }
    if (e.dead) continue;

    // Gravity
    e.vy = Math.min(e.vy + GRAV, MAX_FALL);

    // Shell logic
    if (e.shell && !e.shellMoving) {
      e.vx = 0;
    }

    e.x += e.vx;
    if (collideX(e)) e.vx = -e.vx;
    e.y += e.vy;
    collideY(e);

    // Fall off
    if (e.y > LEVEL_H * TILE + 32) { e.dead = true; continue; }

    // Moving shell kills other enemies
    if (e.shell && e.shellMoving) {
      for (const o of enemies) {
        if (o === e || o.dead || o.squishTimer > 0 || !o.active) continue;
        if (overlap(e, o)) { o.dead = true; score += 100; spawnScoreText(o.x, o.y, '100'); }
      }
    }

    // Player collision
    if (!player.dead && !levelComplete && overlap(player, e)) {
      if (e.shell && !e.shellMoving) {
        // Kick shell
        e.shellMoving = true;
        e.vx = player.x + player.w / 2 < e.x + e.w / 2 ? 3.5 : -3.5;
        score += 100;
      } else if (player.vy > 0 && player.y + player.h - e.y < 10) {
        // Stomp!
        player.vy = keys['ArrowUp'] || keys['KeyW'] || keys['Space'] ? -6.5 : -4.5;
        score += 100;
        spawnScoreText(e.x, e.y, '100');
        if (e.type === 'turtle' && !e.shell) {
          e.shell = true; e.shellMoving = false; e.h = 12; e.y += 4; e.vx = 0;
        } else if (e.shell) {
          e.shellMoving = false; e.vx = 0;
        } else {
          e.squishTimer = 30; e.vx = 0;
        }
      } else {
        hurtPlayer();
      }
    }

    e.animTimer++;
  }
  enemies = enemies.filter(e => !e.dead);
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function spawnScoreText(x, y, text) {
  floatTexts.push({x, y, text, timer: 35});
}

// ============================================================
// ITEMS & PARTICLES
// ============================================================
function updateItems() {
  for (const it of items) {
    if (it.rising > 0) { it.rising--; it.y -= 1; continue; }
    it.vy = Math.min(it.vy + GRAV, MAX_FALL);
    it.x += it.vx;
    if (collideX(it)) it.vx = -it.vx;
    it.y += it.vy;
    collideY(it);
    if (it.y > LEVEL_H * TILE + 32) { it.dead = true; continue; }
    if (!player.dead && overlap(player, it)) {
      it.dead = true;
      score += 1000;
      spawnScoreText(it.x, it.y, '1000');
      if (!player.big) { player.big = true; player.h = 14; player.growTimer = 25; }
    }
  }
  items = items.filter(i => !i.dead);
}

function updateParticles() {
  for (const p of particles) {
    p.timer--;
    if (p.type === 'coinPop') { p.y += p.vy; p.vy += 0.4; }
    if (p.type === 'debris') { p.x += p.vx; p.y += p.vy; p.vy += 0.35; }
  }
  particles = particles.filter(p => p.timer > 0);
  for (const f of floatTexts) { f.timer--; f.y -= 0.5; }
  floatTexts = floatTexts.filter(f => f.timer > 0);
  // Bump animations
  for (const k in bumpAnims) { bumpAnims[k]--; if (bumpAnims[k] <= 0) delete bumpAnims[k]; }
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera() {
  const target = player.x - W * 0.4;
  if (target > camX) camX = target; // camera only moves right, classic style
  camX = Math.max(0, Math.min(camX, LEVEL_W * TILE - W));
}

// ============================================================
// RENDERING
// ============================================================
const SKY = '#5c94fc';

function draw() {
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);

  const ox = Math.floor(camX);

  // Background clouds (parallax-ish, simple)
  drawClouds(ox);

  // Tiles
  const startCol = Math.floor(ox / TILE);
  for (let ty = 0; ty < LEVEL_H; ty++)
    for (let tx = startCol; tx <= startCol + COLS + 1 && tx < LEVEL_W; tx++) {
      const t = level[ty][tx];
      if (t === 0) continue;
      let img = null;
      switch (t) {
        case 1: img = tileCanvas['ground']; break;
        case 2: img = tileCanvas['brick']; break;
        case 3: case 4: img = tileCanvas['qblock']; break;
        case 5: img = tileCanvas['pipe_tl']; break;
        case 6: img = tileCanvas['pipe_tr']; break;
        case 7: img = tileCanvas['pipe_bl']; break;
        case 8: img = tileCanvas['pipe_br']; break;
        case 9: img = tileCanvas['stair']; break;
        case 12: img = tileCanvas['flag_pole']; break;
        case 14: img = tileCanvas['flag_top']; break;
        case 15: img = tileCanvas['castle_brick']; break;
        case 16: img = null; break; // door = dark
        case 17: img = tileCanvas['used']; break;
      }
      const dx = tx * TILE - ox;
      let dy = ty * TILE;
      // Bump animation offset
      const bk = tx + ',' + ty;
      if (bumpAnims[bk]) dy -= Math.sin((bumpAnims[bk] / 8) * Math.PI) * 5;
      if (t === 16) { ctx.fillStyle = '#000'; ctx.fillRect(dx, dy, TILE, TILE); }
      else if (img) ctx.drawImage(img, dx, dy);
      // Coin tile
      if (t === 11) {
        const cf = coinFrames[Math.floor(frame / 8) % 3];
        ctx.drawImage(cf, dx + 4, dy + 1);
      }
    }

  // Flag on pole
  drawFlag(ox);

  // Items
  for (const it of items) ctx.drawImage(mushroom, Math.floor(it.x - ox), Math.floor(it.y));

  // Enemies
  for (const e of enemies) {
    if (!e.active || e.dead) continue;
    const ex = Math.floor(e.x - ox), ey = Math.floor(e.y);
    if (e.squishTimer > 0) { ctx.drawImage(grumpFlat, ex, ey); continue; }
    if (e.type === 'grump') {
      ctx.drawImage(Math.floor(e.animTimer / 10) % 2 === 0 ? grump1 : grump2, ex, ey);
    } else {
      if (e.shell) ctx.drawImage(shell, ex, ey);
      else ctx.drawImage(Math.floor(e.animTimer / 10) % 2 === 0 ? turt1 : turt2, ex, ey);
    }
  }

  // Player
  drawPlayer(ox);

  // Particles
  for (const p of particles) {
    if (p.type === 'coinPop') ctx.drawImage(coinFrames[0], Math.floor(p.x - ox), Math.floor(p.y));
    if (p.type === 'debris') {
      ctx.fillStyle = BRICK_MAIN;
      ctx.fillRect(Math.floor(p.x - ox), Math.floor(p.y), 5, 5);
    }
  }

  // Float texts
  ctx.fillStyle = '#fff';
  ctx.font = '7px monospace';
  for (const f of floatTexts) ctx.fillText(f.text, Math.floor(f.x - ox), Math.floor(f.y));

  // HUD
  drawHUD();

  // State overlays
  if (state === 'title') drawTitle();
  if (state === 'gameover') drawGameOver();
  if (state === 'win') drawWinScreen();
}

function drawPlayer(ox) {
  const p = player;
  if (p.invincible > 0 && frame % 4 < 2 && !p.dead) return; // blink
  const dx = Math.floor(p.x - ox) - 2;
  const dy = Math.floor(p.y) - (p.big ? 16 : 2);
  let spr;
  if (p.dead) spr = playerSprites.stand[p.dir === 1 ? 0 : 1];
  else if (!p.grounded) spr = playerSprites.jump[p.dir === 1 ? 0 : 1];
  else if (Math.abs(p.vx) > 0.2) spr = playerSprites.run[p.animFrame][p.dir === 1 ? 0 : 1];
  else spr = playerSprites.stand[p.dir === 1 ? 0 : 1];

  if (p.big) {
    ctx.drawImage(spr, dx, dy - 2, 12, 18);
  } else {
    ctx.drawImage(spr, dx, dy + 2, 12, 14);
  }
}

function drawFlag(ox) {
  // Find flagpole x
  const fx = 190 * TILE - ox;
  if (fx < -32 || fx > W + 32) return;
  const flagY = levelComplete ? 11 * TILE : 4 * TILE + 8;
  ctx.fillStyle = '#30a020';
  ctx.beginPath();
  ctx.moveTo(fx + 7, flagY);
  ctx.lineTo(fx - 7, flagY + 5);
  ctx.lineTo(fx + 7, flagY + 10);
  ctx.fill();
}

function drawClouds(ox) {
  ctx.fillStyle = '#ffffff';
  const cloudPos = [
    [100, 40], [400, 55], [750, 35], [1100, 50], [1500, 38], [1900, 55],
    [2300, 42], [2700, 35], [3100, 50], [3400, 40],
  ];
  for (const [cx, cy] of cloudPos) {
    const x = cx - ox * 0.9;
    if (x < -60 || x > W + 60) continue;
    ctx.beginPath();
    ctx.arc(x, cy, 10, 0, Math.PI * 2);
    ctx.arc(x + 12, cy - 4, 12, 0, Math.PI * 2);
    ctx.arc(x + 26, cy, 10, 0, Math.PI * 2);
    ctx.fill();
  }
  // Hills
  ctx.fillStyle = '#30a020';
  const hillPos = [0, 500, 1000, 1600, 2200, 2800, 3300];
  for (const hx of hillPos) {
    const x = hx - ox;
    if (x < -100 || x > W + 100) continue;
    ctx.beginPath();
    ctx.arc(x + 40, 13 * TILE, 40, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = '#60d850';
  for (const hx of hillPos) {
    const x = hx - ox;
    if (x < -100 || x > W + 100) continue;
    ctx.beginPath();
    ctx.arc(x + 40, 13 * TILE, 34, Math.PI, 0);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('PIXEL BROS', 16, 12);
  ctx.fillText(String(score).padStart(6, '0'), 16, 21);
  ctx.fillText('\u00D7' + String(coins).padStart(2, '0'), 96, 21);
  // coin icon in HUD
  ctx.drawImage(coinFrames[Math.floor(frame / 8) % 3], 88, 13);
  ctx.fillText('WORLD', 140, 12);
  ctx.fillText(' 1-1', 140, 21);
  ctx.fillText('TIME', 208, 12);
  ctx.fillText(' ' + String(Math.max(0, Math.floor(time))).padStart(3, '0'), 208, 21);
  ctx.fillText('\u2665' + lives, 16, 232);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f8d830';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SUPER', W/2, 70);
  ctx.fillText('PIXEL BROS', W/2, 95);
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText('A Classic-Style Platformer', W/2, 120);
  ctx.fillText('Arrow Keys / WASD = Move & Jump', W/2, 150);
  ctx.fillText('Z / X / Shift = Run', W/2, 164);
  ctx.fillText('Stomp enemies! Hit ? blocks!', W/2, 185);
  if (frame % 60 < 40) ctx.fillText('PRESS ENTER TO START', W/2, 210);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, 110);
  ctx.font = '10px monospace';
  if (frame % 60 < 40) ctx.fillText('PRESS ENTER TO RETRY', W/2, 140);
  ctx.textAlign = 'left';
}

function drawWinScreen() {
  if (winTimer > 60) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f8d830';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COURSE CLEAR!', W/2, 100);
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText('SCORE: ' + score, W/2, 130);
    ctx.fillText('TIME BONUS: ' + (time * 10), W/2, 145);
    if (frame % 60 < 40) ctx.fillText('PRESS ENTER TO PLAY AGAIN', W/2, 175);
    ctx.textAlign = 'left';
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastEnter = false;
function update() {
  frame++;
  const enter = keys['Enter'];
  const enterPressed = enter && !lastEnter;
  lastEnter = enter;

  if (keys['KeyR'] && state !== 'title') { resetLevel(); state = 'playing'; }

  switch (state) {
    case 'title':
      if (enterPressed) { score = 0; coins = 0; lives = 3; resetLevel(); state = 'playing'; }
      break;
    case 'playing':
      updatePlayer();
      updateEnemies();
      updateItems();
      updateParticles();
      updateCamera();
      // Timer
      timeAcc++;
      if (timeAcc >= 24) { timeAcc = 0; time--; if (time <= 0 && !player.dead) killPlayer(true); }
      break;
    case 'dying':
      winTimer++;
      if (winTimer > 20) { player.vy = Math.min(player.vy + GRAV, MAX_FALL); player.y += player.vy; }
      if (winTimer > 120) {
        lives--;
        if (lives <= 0) state = 'gameover';
        else { resetLevel(); state = 'playing'; }
      }
      break;
    case 'gameover':
      if (enterPressed) { score = 0; coins = 0; lives = 3; resetLevel(); state = 'playing'; }
      break;
    case 'win':
      winTimer++;
      updateParticles();
      // Slide down pole then walk to castle
      if (winTimer < 40) { player.y = Math.min(player.y + 2, 12 * TILE - player.h); }
      else if (winTimer < 100) { player.x += 1.2; player.dir = 1; }
      if (enterPressed && winTimer > 80) { resetLevel(); state = 'playing'; }
      break;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetLevel();
loop();
</script>
